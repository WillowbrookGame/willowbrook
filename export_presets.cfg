[preset.0]

name="Web Preview"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="addons/*,paintball_prototype/network/browser/standalone-runtime/*,paintball_prototype/network/browser/standalone-runtime-manifest.json,web-arcade/*,browser-preview/*,*.ps1,*.mjs,*.md,test_*.gd"
export_path=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell="res://browser-preview/loading-shell.html"
html/head_include="<script src=\"./web-arcade/shell.js\"></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
