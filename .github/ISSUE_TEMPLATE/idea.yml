name: Suggest an idea
description: Suggest a game feature, world expansion, or self-hosting improvement.
title: "Idea: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Willowbrook. Issues are public. Please leave out player names, chats, account details, saves, and private links.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea and where it would fit in the game or hosting experience.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Who would it help, and how?
      description: A quick example from a player's, parent's, or host's perspective is enough.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What could a small first version look like?
      description: Optional. Link related roadmap items or issues if you know of any.
