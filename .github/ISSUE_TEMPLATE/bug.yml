name: Report a bug
description: Report a problem in the game, Parent Desk, or Docker hosting setup.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Issues are public.**
        If this is a security or privacy vulnerability, please use the [private security reporting form](https://github.com/WillowbrookGame/willowbrook/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: Which alpha release or git commit are you running?
      placeholder: "e.g., v0.1.0-alpha.1 or main (abc1234)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser, and host
      description: Tell us what you played on and how Willowbrook was hosted.
      placeholder: "e.g., iPad Safari + Linux x86-64 Docker Compose"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do right before the problem happened?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened vs. what you expected
      description: Include redacted screenshots or console/server logs if helpful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed children's names, photos, account details, chat logs, save files, tokens, and private family server URLs.
          required: true
